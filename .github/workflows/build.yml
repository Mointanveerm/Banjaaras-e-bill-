name: Build Banjaaras Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install System Dependencies
      run: |
        sudo dpkg --add-architecture i386
        sudo apt-get update
        sudo apt-get install -y \
          git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config \
          zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev \
          libssl-dev build-essential ccache libltdl-dev
        pip install --upgrade pip
        pip install --upgrade buildozer cython virtualenv

    - name: Pre-accept Android SDK Licenses
      run: |
        mkdir -p /usr/local/lib/android/sdk/licenses
        echo "24333f8a63b6825ea3c5514f83c2829b004d1fee" > /usr/local/lib/android/sdk/licenses/android-sdk-license
        echo "d56f5187479451eabf01fb78af6dfcb131a648cd" > /usr/local/lib/android/sdk/licenses/android-sdk-preview-license
        echo "84831b9409646a918e30573bab4c9c91346d8abd" > /usr/local/lib/android/sdk/licenses/intel-android-extra-license

    - name: Cache Buildozer global directory
      uses: actions/cache@v4
      with:
        path: ~/.buildozer
        key: ${{ runner.os }}-buildozer-${{ hashFiles('app/buildozer.spec') }}
        restore-keys: |
          ${{ runner.os }}-buildozer-

    - name: Build with Buildozer
      working-directory: ./app
      run: |
        buildozer android debug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Banjaaras-Catering-APK
        path: app/bin/*.apk
