name: Build Android APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Enable 32-bit architecture support
        run: sudo dpkg --add-architecture i386

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            zip \
            unzip \
            openjdk-17-jdk \
            python3-pip \
            autoconf \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libtinfo5 \
            cmake \
            libffi-dev \
            libssl-dev \
            automake \
            build-essential \
            ccache \
            libc6:i386 \
            libstdc++6:i386 \
            zlib1g:i386 \
            libncurses5:i386

      - name: Set JAVA_HOME to JDK 17
        run: echo "JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64" >> $GITHUB_ENV

      - name: Clear pre-installed Android SDK/NDK env vars
        # ubuntu-22.04 runners ship with their own Android SDK/NDK already on
        # ANDROID_HOME / ANDROID_SDK_ROOT / ANDROID_NDK*. Buildozer needs to
        # manage its own SDK/NDK (pinned to NDK 25b in buildozer.spec) inside
        # ~/.buildozer, and the two conflicting installs make the
        # `python -m pythonforandroid.toolchain create` step fail silently.
        # Unsetting these here forces buildozer to use only what it downloads.
        run: |
          echo "ANDROID_HOME=" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=" >> $GITHUB_ENV
          echo "ANDROID_NDK_LATEST_HOME=" >> $GITHUB_ENV

      - name: Install Buildozer and Cython
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade buildozer cython==0.29.36 virtualenv

      - name: Cache Buildozer global directory
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: buildozer-global-${{ hashFiles('app/buildozer.spec') }}
          restore-keys: |
            buildozer-global-

      - name: Cache Buildozer project build directory
        uses: actions/cache@v4
        with:
          path: app/.buildozer
          key: buildozer-project-${{ runner.os }}-${{ hashFiles('app/buildozer.spec') }}
          restore-keys: |
            buildozer-project-${{ runner.os }}-

      - name: Pre-accept Android SDK licenses
        run: |
          ANDROID_SDK_ROOT="$HOME/.buildozer/android/platform/android-sdk"
          mkdir -p "$ANDROID_SDK_ROOT/licenses"
          echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" > "$ANDROID_SDK_ROOT/licenses/android-sdk-license"
          echo "d56f5187479451eabf01fb78af6dfcb131a6481e" >> "$ANDROID_SDK_ROOT/licenses/android-sdk-license"
          echo "84831b9409646a918e30573bab4c9c91346d8abd" > "$ANDROID_SDK_ROOT/licenses/android-sdk-preview-license"

      - name: Build APK with Buildozer
        working-directory: ./app
        run: |
          set -o pipefail
          buildozer -v android debug 2>&1 | tee buildozer_build.log

      - name: Upload full build log (always, for debugging)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: buildozer-build-log
          path: app/buildozer_build.log
          if-no-files-found: warn

      - name: Locate built APK
        working-directory: ./app
        run: find . -name "*.apk" -maxdepth 4

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: banjaaras-catering-apk
          path: app/bin/*.apk
          if-no-files-found: error
          retention-days: 30
          
