name: Build Android APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Enable 32-bit architecture support
        run: sudo dpkg --add-architecture i386

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            zip \
            unzip \
            openjdk-17-jdk \
            python3-pip \
            autoconf \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libtinfo5 \
            cmake \
            libffi-dev \
            libssl-dev \
            automake \
            build-essential \
            ccache \
            libc6:i386 \
            libstdc++6:i386 \
            zlib1g:i386 \
            libncurses5:i386

      - name: Set JAVA_HOME to JDK 17
        run: echo "JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64" >> $GITHUB_ENV

      - name: Install Buildozer and Cython
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade buildozer cython==0.29.36 virtualenv

      - name: Cache Buildozer global directory
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: buildozer-global-${{ hashFiles('app/buildozer.spec') }}
          restore-keys: |
            buildozer-global-

      - name: Cache Buildozer project build directory
        uses: actions/cache@v4
        with:
          path: app/.buildozer
          key: buildozer-project-${{ runner.os }}-${{ hashFiles('app/buildozer.spec') }}
          restore-keys: |
            buildozer-project-${{ runner.os }}-

      - name: Build APK with Buildozer
        working-directory: ./app
        run: |
          yes | buildozer -v android debug

      - name: Locate built APK
        working-directory: ./app
        run: find . -name "*.apk" -maxdepth 3

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: banjaaras-catering-apk
          path: app/bin/*.apk
          if-no-files-found: error
          retention-days: 30
