name: Build Android APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Enable 32-bit architecture support
        run: sudo dpkg --add-architecture i386

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            zip \
            unzip \
            openjdk-17-jdk \
            python3-pip \
            autoconf \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libtinfo5 \
            cmake \
            libffi-dev \
            libssl-dev \
            automake \
            build-essential \
            ccache \
            libc6:i386 \
            libstdc++6:i386 \
            zlib1g:i386 \
            libncurses5:i386

      - name: Set JAVA_HOME to JDK 17
        run: echo "JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64" >> $GITHUB_ENV

      - name: Clear pre-installed Android SDK/NDK env vars
        # ubuntu-22.04 runners ship with their own Android SDK/NDK already on
        # ANDROID_HOME / ANDROID_SDK_ROOT / ANDROID_NDK*. Buildozer needs to
        # manage its own SDK/NDK (pinned to NDK 25b in buildozer.spec) inside
        # ~/.buildozer, and the two conflicting installs make the
        # `python -m pythonforandroid.toolchain create` step fail silently.
        # Unsetting these here forces buildozer to use only what it downloads.
        run: |
          echo "ANDROID_HOME=" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=" >> $GITHUB_ENV
          echo "ANDROID_NDK_LATEST_HOME=" >> $GITHUB_ENV

      - name: Install Buildozer and Cython
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade buildozer cython==0.29.36 virtualenv

      - name: Cache Buildozer global directory
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: buildozer-global-v2-${{ hashFiles('app/buildozer.spec') }}
          restore-keys: |
            buildozer-global-v2-

      - name: Cache Buildozer project build directory
        uses: actions/cache@v4
        with:
          path: app/.buildozer
          key: buildozer-project-${{ runner.os }}-${{ hashFiles('app/buildozer.spec') }}
          restore-keys: |
            buildozer-project-${{ runner.os }}-

      - name: Build APK with Buildozer (with retry for transient network errors)
        working-directory: ./app
        run: |
          set -o pipefail
          attempt=1
          max_attempts=3
          until (yes 2>/dev/null || true) | buildozer -v android debug 2>&1 | tee -a buildozer_build.log; do
            exit_code=$?
            echo "### Attempt $attempt failed (exit $exit_code). ###" | tee -a buildozer_build.log
            if [ "$attempt" -ge "$max_attempts" ]; then
              echo "### All $max_attempts attempts failed. Giving up. ###" | tee -a buildozer_build.log
              exit "$exit_code"
            fi
            attempt=$((attempt + 1))
            echo "### Retrying in 20s (attempt $attempt/$max_attempts)... ###" | tee -a buildozer_build.log
            sleep 20
          done

      - name: Print the real error from build log (only runs if build failed)
        if: failure()
        working-directory: ./app
        run: |
          if [ ! -f buildozer_build.log ]; then
            echo "(log file not found)"
            exit 0
          fi

          echo "===== FULL LOG WITH ENVIRONMENT DUMPS STRIPPED OUT ====="
          echo "(this removes the ~100-line env var block buildozer prints"
          echo " on every failure, so the real error is actually visible)"
          awk '
            BEGIN { in_env_dump = 0 }
            {
              if ($0 ~ /^# ENVIRONMENT:/) {
                in_env_dump = 1
                print "--- ENVIRONMENT DUMP OMITTED ---"
                next
              }
              if (in_env_dump == 1) {
                if ($0 ~ /^#     [A-Za-z0-9_]+ = /) {
                  next
                } else {
                  in_env_dump = 0
                }
              }
              print
            }
          ' buildozer_build.log

          echo ""
          echo "===== ALL LINES MATCHING KNOWN ERROR PATTERNS ====="
          grep -n -E -i "error|exception|traceback|failed|fatal|cannot find|not found|no such file|permission denied" buildozer_build.log | grep -v "^[0-9]*:#     " || echo "(no matches)"

          echo ""
          echo "===== LAST 40 RAW LINES (for reference) ====="
          tail -n 40 buildozer_build.log

      - name: Upload full build log (always, for debugging)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: buildozer-build-log
          path: app/buildozer_build.log
          if-no-files-found: warn

      - name: Locate built APK
        working-directory: ./app
        run: find . -name "*.apk" -maxdepth 4

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: banjaaras-catering-apk
          path: app/bin/*.apk
          if-no-files-found: error
          retention-days: 30
        
